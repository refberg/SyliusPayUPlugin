name: Build

on:
    push:
        branches-ignore:
            - 'dependabot/**'
    pull_request: ~
    workflow_dispatch: ~

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    tests:
        runs-on: ubuntu-latest
        name: "PHP ${{ matrix.php }}, Sylius ${{ matrix.sylius }}"

        strategy:
            fail-fast: false
            matrix:
                include:
                    - php: "8.2"
                      sylius: "~2.2.0"
                    - php: "8.3"
                      sylius: "~2.3.0"
                    - php: "8.4"
                      sylius: "~2.3.0"

        services:
            mysql:
                image: mysql:8.0
                env:
                    MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
                ports:
                    - 3306:3306
                options: --health-cmd="mysqladmin ping" --health-interval=5s --health-timeout=5s --health-retries=10

        env:
            APP_ENV: test
            DATABASE_URL: "mysql://root@127.0.0.1:3306/refberg_sylius_payu_plugin_test?serverVersion=8.0"

        steps:
            -
                uses: actions/checkout@v4

            -
                name: Set up PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: "${{ matrix.php }}"
                    extensions: intl, sodium, pdo_mysql
                    coverage: none
                    tools: composer:v2

            -
                name: Validate composer.json
                run: composer validate --ansi --strict

            -
                name: Restrict Sylius version
                run: composer require --no-update --no-scripts --no-interaction "sylius/sylius:${{ matrix.sylius }}"

            -
                name: Install dependencies
                uses: ramsey/composer-install@v3
                with:
                    composer-options: "--prefer-dist"

            -
                name: Check coding standard
                run: vendor/bin/ecs check

            -
                name: Run PHPStan
                run: vendor/bin/phpstan analyse --no-progress

            -
                name: Run unit tests
                run: vendor/bin/phpunit --testsuite=unit

            -
                name: Validate container
                run: vendor/bin/console lint:container

            -
                name: Prepare database
                run: |
                    vendor/bin/console doctrine:database:create --if-not-exists
                    vendor/bin/console doctrine:schema:create
                    vendor/bin/console doctrine:schema:validate

            -
                name: Run integration tests
                run: vendor/bin/phpunit --testsuite=integration
